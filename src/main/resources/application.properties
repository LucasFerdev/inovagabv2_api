spring.application.name=inovagab-api

spring.mongodb.uri=${MONGODB_URI}
spring.mongodb.database=inovagab

server.port=8080

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:3600}
app.jwt.issuer=inovagab-api

app.cadastro.codigo-gestor=${CADASTRO_CODIGO_GESTOR:}
app.cadastro.codigo-lideranca=${CADASTRO_CODIGO_LIDERANCA:}

app.ia.gemini.api-key=${GEMINI_API_KEY:}
app.ia.gemini.model=${GEMINI_MODEL:gemini-3.5-flash-lite}
app.ia.gemini.base-url=${GEMINI_BASE_URL:https://generativelanguage.googleapis.com}
app.ia.gemini.timeout-seconds=${GEMINI_TIMEOUT_SECONDS:20}
